<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>休憩モニター</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="/css/status.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>

<body>

    <div class="container-fluid mt-4">
        <div class="row">

            <div class="col-md-6">
                <h4 class="mb-3">社員一覧（休憩未取得順）</h4>
                <div id="employee-list"></div>
            </div>

            <div class="col-md-6">
                <h4 class="mb-3">休憩中の社員</h4>
                <div id="break-list"></div>
            </div>

        </div>
    </div>

    <!-- ▼▼▼ 下部固定ボタン ▼▼▼ -->
    <div class="bottom-bar">
        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editModal">
            自分のアイコン・座右の銘を編集
        </button>

        <div>
            <button class="btn btn-danger me-2" id="breakEndButton">休憩終了</button>
            <button class="btn btn-success" id="breakButton">休憩する</button>
        </div>
    </div>

    <!-- ▼▼▼ Refresh Pass モーダル ▼▼▼ -->
    <div class="modal fade" id="breakStartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4 modal-pass">

                <h3 class="mb-3 fw-bold">休憩開始！</h3>

                <div class="ticket-wrapper">
                    <div class="ticket-left"></div>
                    <div class="ticket-right"></div>
                    <div class="cut-line"></div>
                    <div class="confetti-container"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- ▼▼▼ プロフィール編集モーダル ▼▼▼ -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">プロフィール編集</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label class="form-label">絵文字</label>
                    <input type="text" id="editEmoji" class="form-control" placeholder="例：🐱">

                    <label class="form-label mt-3">座右の銘</label>
                    <input type="text" id="editMotto" class="form-control" placeholder="例：継続は力なり">
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
                    <button class="btn btn-primary" id="saveProfile">保存</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/js/status.js"></script>

</body>

</html>
